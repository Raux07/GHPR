<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
               min-height: 100vh;
        }

        #count{
            color: white;
            font-size: 4rem;
        }
        #player{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
        }   


    </style>
</head>
<body>

    <p id="count"> 0 </p>
    <div id="player"></div>


    <script>
            let playereEl = document.querySelector('#player');
            let countEl = document.querySelector('#count');
            let count = 0;
            playereEl.addEventListener('click', ()=>{
                count++;
                countEl.innerHTML = count;
            })
    </script>


    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
               min-height: 100vh;
        }

        #count{
            color: white;
            font-size: 4rem;
        }
        #player{
            width: 50px;
            height: 50px;
            border-radius: 50% 40% 20% 45%;
            background: orange;
            animation: anim 3s linear infinite;
        }   


        @keyframes anim{
            
            0%{
                 border-radius: 50% 40% 20% 45%;  
                 scale: 1.1;
            }
            20%{
                 border-radius: 30% 20% 50% 35%;
                 scale: 1.3;
            }
            40%{
                 border-radius: 20% 10% 40% 55%;

                 scale: 1.2;
            }
            60%{
                 border-radius: 30% 20% 50% 35%;
                 scale: 1.5;
            }
            80%{
                 border-radius: 30% 20% 50% 35%;
                 scale: 1.6;
            }
            100%{
                 border-radius: 50% 40% 20% 45%;  
                 scale: 1.1;
            }

        }

    </style>
</head>
<body>

    <p id="count"> 0 </p>
    <div id="player"></div>


    <script>
            let playereEl = document.querySelector('#player');
            let countEl = document.querySelector('#count');
            let count = 0;
            playereEl.addEventListener('click', ()=>{
                count++;
                countEl.innerHTML = count;
            })
    </script>


    
</body>
</html>
